name: Mise à jour des données

on:
  schedule:
    - cron: "7,37 * * * *"   # 2 fois par heure (UTC) : GitHub saute beaucoup de déclenchements
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collecte (FotMob + cotes Unibet)
        run: python scripts/update.py
      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Si main a bougé pendant le run (autre push), on récupère puis on réessaie
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
