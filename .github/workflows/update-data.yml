name: Mise à jour des données

on:
  schedule:
    - cron: "7,37 * * * *"   # 2 fois par heure (UTC) : GitHub saute beaucoup de déclenchements
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collecte (FotMob + cotes Unibet)
        run: python scripts/update.py
      - name: Enregistrement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git add data/
            git diff --cached --quiet && exit 0   # rien de nouveau à enregistrer
            git commit -q -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push && exit 0
            # main a bougé pendant le run (autre run ou autre push). Les fichiers de
            # data/ tiennent sur une ligne : impossible de fusionner. On repart donc
            # de la version distante et on refait la collecte par-dessus.
            git fetch origin main
            git reset --hard origin/main
            python scripts/update.py
          done
          exit 1
