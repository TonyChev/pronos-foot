<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f2a">
  <title>Pronos Foot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>⚽ Pronos Foot</h1>
    <div class="topbar-right">
      <button id="refresh-odds" class="icon-btn" title="Actualiser les cotes Unibet">↻ Cotes</button>
      <span id="user-box"></span>
    </div>
  </header>

  <main>
    <section id="view-matches" class="view">
      <div class="days" role="tablist">
        <button data-day="0" class="chip-day active">Aujourd'hui</button>
        <button data-day="1" class="chip-day">Demain</button>
      </div>
      <div id="comp-filter" class="comp-filter"></div>
      <p id="updated" class="muted small"></p>
      <div id="matches"></div>
    </section>

    <section id="view-slip" class="view" hidden></section>
    <section id="view-bets" class="view" hidden></section>
  </main>

  <nav class="tabbar">
    <button data-view="matches" class="active"><span>📅</span>Matchs</button>
    <button data-view="slip"><span>🧾</span>Bulletin <b id="slip-count" class="badge" hidden>0</b></button>
    <button data-view="bets"><span>📊</span>Mes paris</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
